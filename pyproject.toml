[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wef"
version = "0.1.0"
description = "AI-Based Prediction of Water Demand and Electricity Consumption (MCA seminar project)"
authors = [{ name = "Manthan Sankpal" }]
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
