  - id: b3_lp
    layout: content
    backup: B3
    title: "Backup – Pump-Scheduling Linear Programme"
    blocks:
      - type: text
        size: 22
        lines:
          - "minimise   Σₕ cₕ · e · pₕ"
          - "subject to   Lₕ = Lₕ₋₁ + pₕ − dₕ"
          - "Lmin ≤ Lₕ ≤ Lmax,   0 ≤ pₕ ≤ Pmax,   L₂₄ ≥ L₀"
          - "pₕ pumped volume, dₕ forecast demand, cₕ tariff, e energy per m³"
    side: right
    tiles:
      - kind: info
        head: "Illustrative values"
        lines:
          - "Tank {{o:assumptions.tank.capacity_m3}} m³"
          - "Pump {{o:assumptions.pump.max_m3_per_h}} m³/h, {{o:assumptions.pump.kwh_per_m3}} kWh/m³"
          - "Tariff ×{{o:assumptions.tariff.multipliers.off_peak}} off-peak, ×{{o:assumptions.tariff.multipliers.peak}} peak"
    footnote: "Solved with SciPy linprog (HiGHS) for each test day; ILLUSTRATIVE ASSUMPTIONS, not a real utility's."
    notes: >-
      The linear programme decides the volume pumped in each hour of the day. The objective is the energy cost,
      the tariff times the energy per cubic metre times the volume. The constraints are the tank balance, the
      lower and upper tank levels, the pump capacity, and an end-of-day level at least equal to the start, so
      that one day cannot borrow water from the next. The plan is then run against actual demand, with
      corrective pumping whenever the tank would fall below its minimum.

