          - ["Outlier hours flagged and kept", "{{e:electricity.outlier_hours_flagged|int}}", "{{e:water.outlier_hours_flagged|int}}"]
          - ["Duplicate timestamps", "{{e:electricity.duplicated_timestamps}}", "{{e:water.duplicated_timestamps}}"]
    footnote: "Gaps up to {{c:cleaning.max_interpolate_hours}} hours interpolated; longer gaps excluded from evaluation, never invented."
    notes: >-
      This table shows what cleaning did to each series. Short gaps of up to {{c:cleaning.max_interpolate_hours}}
      hours were interpolated. Longer gaps were left missing and excluded from evaluation, because inventing
      values there would flatter every model. Outliers were flagged with a rolling median absolute deviation
      rule, but kept, because a sudden high reading can be genuine demand. Daylight-saving changes were resolved
      explicitly, and there are no duplicate timestamps after cleaning.

  - id: b5_limitations
    layout: content
    backup: B5
    title: "Backup – Limitations"
    blocks:
      - type: bullets
        items:
          - "Electricity from one household, noisier than a feeder"
          - "Leak labels from a simulated network (L-Town)"
          - "European data, not Indian utility data"
          - "Observed weather used in place of weather forecasts"
          - "Illustrative tariff and tank; injected electricity anomalies"
    notes: >-
      I want to be clear about the limitations. The electricity data comes from a single household, which is
      much noisier than a feeder or a city. The leak labels come from a simulated network. All data are European,
      because I could not find open Indian utility data at this resolution. I used observed weather in place of
      a weather forecast, so real accuracy would be slightly lower. The tariff and tank values are illustrative,
      and the electricity anomalies were injected for testing.
